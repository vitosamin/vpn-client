# Release: build the signed APK and publish it to GitHub Releases.
#
# The Hiddify licence requires the fork's releases to be built by GitHub Actions, so this workflow
# is the only way to publish. A phone updates itself from the published release (the app checks
# the GitHub releases API and offers the APK), so no store is involved.
#
# Needed repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    release.jks, base64-encoded (`base64 -w0 release.jks`)
#   KEYSTORE_PASSWORD  the keystore/key password
#   KEY_ALIAS          vitosamin
name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.0.2)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: ver
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          app="$(sed -n 's/^version: //p' pubspec.yaml | head -1)"
          if [ "${app%%+*}" != "$version" ]; then
            echo "::error::pubspec.yaml says [$app] but the tag is [$tag]; bump the version before tagging"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate code
        run: |
          flutter pub get
          dart run slang
          dart run build_runner build --delete-conflicting-outputs

      - name: Fetch the core AAR
        run: make android-libs CHANNEL=prod

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=${KEY_ALIAS:-vitosamin}
          storeFile=$PWD/android/release.jks
          EOF
          chmod 600 android/key.properties android/release.jks

      - name: Build APKs
        run: |
          # splits.abi.universalApk is on: one build gives the universal APK and the per-ABI
          # ones (arm64-v8a is the one phones download).
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/vitosamin-${{ steps.ver.outputs.version }}-release.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/vitosamin-${{ steps.ver.outputs.version }}-release-arm64.apk"
          cd dist && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Verify the signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            "dist/vitosamin-${{ steps.ver.outputs.version }}-release.apk" | head -5

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Vitosamin ${{ steps.ver.outputs.version }}
          body: |
            Vitosamin ${{ steps.ver.outputs.version }} — Android.

            **Установка:** скачайте `vitosamin-${{ steps.ver.outputs.version }}-release.apk`
            (универсальный) или `…-arm64.apk` (компактный, для современных телефонов) и
            откройте файл. Обновление поверх прошлой версии сохраняет настройки.

            Подпись: `CN=Vitosamin` — обновления ставятся поверх предыдущих сборок.
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
